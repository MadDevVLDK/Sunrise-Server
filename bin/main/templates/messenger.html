<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunrise - Мессенджер</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/static/css/messenger-style.css}">
</head>
<body>
    <div id="root"></div>
    <div id="error-message" style="position: fixed; top: 0; left: 0; right: 0; background-color: #e74c3c; color: white; padding: 16px; text-align: center; display: none; z-index: 9999;"></div>

    <script>
        console.log('[Messenger] Page loaded');
        window.addEventListener('error', (event) => {
            console.error('[Messenger] Global error:', event.error);
            const errorDiv = document.getElementById('error-message');
            if (errorDiv) {
                errorDiv.textContent = 'Ошибка: ' + (event.error?.message || 'Неизвестная ошибка');
                errorDiv.style.display = 'block';
            }
        });
    </script>

    <!-- React и инструменты -->
    <script crossorigin src="https://unpkg.com/react@17.0.2/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- WebSocket (SockJS + STOMP) -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <script th:src="@{/static/js/utils/base-path.js}"></script>

    <script>
        console.log('[Messenger] React loaded:', typeof React);
    </script>

    <!-- Сервисы -->
    <script th:src="@{/static/js/services/api.js}"></script>
    <script th:src="@{/static/js/services/auth-service.js}"></script>

    <script>
        console.log('[Messenger] Services loaded:', typeof API, typeof AuthService);
    </script>

    <!-- Компоненты -->
    <script th:src="@{/static/js/components/user-menu.js}" type="text/babel"></script>
    <script th:src="@{/static/js/components/chat-list.js}" type="text/babel"></script>
    <script th:src="@{/static/js/components/sidebar.js}" type="text/babel"></script>
    <script th:src="@{/static/js/components/main-area.js}" type="text/babel"></script>
    <script th:src="@{/static/js/messenger-app.js}" type="text/babel"></script>
    <script th:src="@{/static/js/components/chat-window.js}" type="text/babel"></script>

    <script>
        console.log('[Messenger] All scripts loaded successfully');
    </script>
</body>
</html>
