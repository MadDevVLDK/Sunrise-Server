# application.yml
server:
  port: ${SERVER_PORT:10610}
  servlet:
    context-path: ${SERVER_BASE_PATH:/app}
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: Sunrise-Server
  config:
    activate:
      on-profile: docker-full-stack, docker-only-app, local
  autoconfigure.exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration # у меня ваще-то jwt используется

  jackson:
    generator:
      write_numbers_as_strings: true

  mail:
    host: smtp.mail.ru
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp:
        auth: true
        ssl.enable: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    servlet.content-type: text/html

  datasource:
    url: jdbc:postgresql://${DB_ADDRESS}/${DB_NAME}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate.ddl-auto: ${SPRING_JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        cache:
          use_second_level_cache: false
          use_query_cache: false
        format_sql: ${SPRING_HIBERNATE_FORMAT_SQL:false}
        hibernate.transaction.jta.platform: org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform # ЭТО ДО ТЕХ ПОР, ПОКА 1 БАЗА ДАННЫХ
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - ping
          - info
          - metrics
          - env
          - configprops
          - beans
          - threaddump
          - heapdump
          - loggers
  endpoint:
    health:
      show-details: when-authorized
  server:
    port: ${SERVER_ACTUATOR_PORT:10611}

logging:
  level:
    com.sunrise: ${LOGGING_LEVEL_APP:DEBUG}
    org.hibernate.SQL: ${LOGGING_LEVEL_ORG_HIBERNATE_SQL:WARN}

app:
  jwt:
    secret: ${JWT_SECRET:mysupersecretkeymysupersecretkeymysupersecretkey}
    expiration: ${APP_JWT_EXPIRATION:36000} # in seconds
    no-jwt-endpoints: /ping,/cache-status,/api/auth/login,/api/auth/register,/api/auth/change-password,/api/auth/reset-password,/forms/**,/static/**,/ws/**
  api:
    rate-limit:
      enabled: ${API_RATE_LIMIT_ENABLED:true}
      default-limit: ${API_RATE_LIMIT_DEFAULT:300}
      urls: # Поддерживаются точные пути, а также паттерны (Ant-стиль)
        "/api/auth/login": ${API_RATE_LIMIT_LOGIN:10}
        "/api/auth/register": ${API_RATE_LIMIT_REGISTER:5}
        "/api/chats/create-personal": ${API_RATE_LIMIT_CREATE_PERSONAL:20}
        "/api/chats/create-group": ${API_RATE_LIMIT_CREATE_GROUP:20}
        "/api/chats/*/messages/send": ${API_RATE_LIMIT_SEND_MESSAGE:30}
        "/api/chats/*/messages/*/edit": ${API_RATE_LIMIT_EDIT_MESSAGE:10}
        "/api/chats/*/messages/*/delete": ${API_RATE_LIMIT_DELETE_MESSAGE:10}
        "/api/chats/*/sync": ${API_RATE_LIMIT_CHAT_SYNC:60}
        "/api/users/sync": ${API_RATE_LIMIT_USER_SYNC:30}
        "/api/profiles/**": ${API_RATE_LIMIT_PROFILES:100}
        "/actuator/**": 0   # 0 – без ограничений
  websocket:
    action-ttl-seconds: 30
    rate-limit:
      enabled: ${WS_RATE_LIMIT_ENABLED:true}
      default-limit: ${WS_RATE_LIMIT_DEFAULT:60}   # лимит для команд, не перечисленных ниже
      commands:
        send_message: ${WS_RATE_LIMIT_SEND_MESSAGE:30}   
        edit_message: ${WS_RATE_LIMIT_EDIT_MESSAGE:10}     
        delete_message: ${WS_RATE_LIMIT_DELETE_MESSAGE:10}   
        mark_read: ${WS_RATE_LIMIT_MARK_READ:60}          
        user_action: ${WS_RATE_LIMIT_USER_ACTION:20}       
        ping: ${WS_RATE_LIMIT_PING:5}                        
        subscription: ${WS_RATE_LIMIT_SUBSCRIPTION:20}      
  mail:
    mail-address: ${MAIL_USERNAME}
    base-url: http://${SERVER_IP:localhost}:${SERVER_PORT:10610}${SERVER_BASE_PATH:/app}
  locks:
    # in seconds
    timeout: ${APP_LOCKS_TIMEOUT:5}
    clean-up-expiration: ${APP_LOCKS_CLEAN_UP_EXPIRATION:100000}
    clean-up-schedule: ${APP_LOCKS_CLEAN_UP_SCHEDULE:300000}
  cache:
    max-per-chat:
      messages: ${APP_CACHE_MAX_PER_CHAT_MESSAGES:200}
      chat-members: ${APP_CACHE_MAX_PER_CHAT_CHAT_MEMBERS:500}
    max-size:
      user: ${APP_CACHE_MAX_SIZE_USER:100000}
      username-index: ${APP_CACHE_MAX_SIZE_USERNAME_INDEX:150000}
      email-index: ${APP_CACHE_MAX_SIZE_EMAIL_INDEX:150000}
      chat: ${APP_CACHE_MAX_SIZE_CHAT:200000}
      personal-chat-index: ${APP_CACHE_MAX_SIZE_PERSONAL_CHAT_INDEX:100000}
      chat-members: ${APP_CACHE_MAX_SIZE_CHAT_MEMBERS:150000}
      verification-tokens: ${APP_CACHE_MAX_SIZE_VERIFICATION_TOKENS:100000}
      recent-messages-ids: ${APP_CACHE_MAX_SIZE_RECENT_MESSAGES_IDS:25000}
      recent-chat-members-ids: ${APP_CACHE_MAX_SIZE_RECENT_CHAT_MEMBERS_IDS:50000}
    ttl:
      user: ${APP_CACHE_TTL_USER:60}
      user-username-index: ${APP_CACHE_TTL_USER_USERNAME_INDEX:60}
      user-email-index: ${APP_CACHE_TTL_USER_EMAIL_INDEX:60}
      chat: ${APP_CACHE_TTL_CHAT:720}
      personal-chat-index: ${APP_CACHE_TTL_PERSONAL_CHAT_INDEX:720}
      chat-members: ${APP_CACHE_TTL_CHAT_MEMBERS:240}
      verification-tokens: ${APP_CACHE_TTL_VERIFICATION_TOKENS:60}
      recent-messages-ids: ${APP_CACHE_TTL_RECENT_MESSAGES_IDS:20}
      recent-chat-members-ids: ${APP_CACHE_TTL_RECENT_CHAT_MEMBERS_IDS:20}